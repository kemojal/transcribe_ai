name: Deploy FastAPI to VPS

on:
  push:
    branches:
      - feature/docker_compose
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Check VPS status
        run: |
          ssh -o ConnectTimeout=30 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo 'VPS Architecture:' && uname -m
            echo 'OS Version:' && cat /etc/os-release | grep VERSION_ID
            echo 'Docker Status:' && (sudo systemctl is-active docker || echo 'Docker not active')
            echo 'Disk Space:' && df -h /
            echo 'Memory:' && free -h
            echo 'Network Status:' && ping -c 1 1.1.1.1 || echo 'Network connectivity issues'
          "

      - name: Prepare VPS directory
        run: ssh -o ConnectTimeout=30 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ~/transcribe_ai && rm -rf ~/transcribe_ai/*"

      - name: Copy files to VPS
        run: scp -r ./* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/transcribe_ai/

      - name: Fix docker-compose version issue
        run: |
          ssh -o ConnectTimeout=30 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/transcribe_ai
            sed -i '/^version:/d' docker-compose.prod.yml
            echo 'Removed obsolete version attribute from docker-compose.prod.yml'
          "

      - name: Verify Docker is running
        run: |
          ssh -o ConnectTimeout=30 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            if ! sudo systemctl is-active --quiet docker; then
              echo 'Starting Docker service...'
              sudo systemctl start docker
              sleep 5
            fi
            
            echo 'Docker service status:'
            sudo systemctl status docker --no-pager || true
            
            echo 'Docker info:'
            sudo docker info || echo 'Could not get Docker info'
          "

      - name: Setup Firewall
        run: |
          ssh -o ConnectTimeout=30 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo 'Configuring firewall...'
            sudo ufw allow 8002/tcp || echo 'Failed to update firewall'
            sudo ufw allow 22/tcp || echo 'Failed to update firewall'
            sudo ufw status || echo 'Failed to check firewall status'
          "

      - name: Stop existing containers
        run: |
          ssh -o ConnectTimeout=30 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/transcribe_ai
            sudo docker compose -f docker-compose.prod.yml down 2>/dev/null || echo 'No containers to stop'
            sudo fuser -k 8002/tcp 2>/dev/null || echo 'No processes using port 8002'
          "

      - name: Create Docker network
        run: |
          ssh -o ConnectTimeout=30 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo 'Creating app network if it doesn't exist...'
            sudo docker network create app_network 2>/dev/null || echo 'Network may already exist'
          "

      - name: Start PostgreSQL container
        run: |
          ssh -o ConnectTimeout=30 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/transcribe_ai
            echo 'Starting PostgreSQL container separately...'
            sudo docker compose -f docker-compose.prod.yml up -d db
            sleep 10
          "
      
      - name: Build and start backend
        run: |
          ssh -o ConnectTimeout=300 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/transcribe_ai
            export DOCKER_CLIENT_TIMEOUT=1200
            export COMPOSE_HTTP_TIMEOUT=1200
            echo 'Building and starting backend container...'
            sudo docker compose -f docker-compose.prod.yml up -d --build backend
          "

      - name: Run database initialization
        run: |
          ssh -o ConnectTimeout=60 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/transcribe_ai
            echo 'Initializing database...'
            sudo docker compose -f docker-compose.prod.yml exec -T backend python -m app.init_db || echo 'Database initialization failed, continuing anyway'
          "

      - name: Check deployment status
        run: |
          ssh -o ConnectTimeout=30 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/transcribe_ai
            sleep 15
            echo '===== CONTAINER STATUS ====='
            sudo docker ps
            
            echo '===== BACKEND LOGS ====='
            sudo docker logs transcribe_ai_backend 2>&1 || echo 'Backend container not found'
            
            echo '===== DATABASE LOGS ====='
            sudo docker logs transcribe_ai_db 2>&1 || echo 'Database container not found'
            
            echo '===== APPLICATION URL ====='
            echo \"http://\$(hostname -I | awk '{print \$1}'):8002\"
            
            echo '===== CHECKING CONNECTION ====='
            curl --connect-timeout 5 --max-time 10 http://localhost:8002/ || echo 'Connection failed'
          "
