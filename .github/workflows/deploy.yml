name: Deploy to VPS

on:
  push:
    branches: [feature/docker_compose]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up SSH
        run: |
          # Debug: Print current directory and user
          pwd
          whoami

          # Debug: Check if secrets are set (without revealing values)
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "SSH_PRIVATE_KEY is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "VPS_HOST is not set"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "VPS_USER is not set"
            exit 1
          fi

          # Create .ssh directory
          mkdir -p /home/runner/.ssh
          chmod 700 /home/runner/.ssh

          # Write SSH key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /home/runner/.ssh/id_rsa
          chmod 600 /home/runner/.ssh/id_rsa

          # Debug: Check if key was written
          ls -la /home/runner/.ssh/

          # Add VPS to known hosts
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> /home/runner/.ssh/known_hosts
          chmod 644 /home/runner/.ssh/known_hosts

          # Debug: Check known_hosts
          cat /home/runner/.ssh/known_hosts

          # Debug: Check SSH key format
          ssh-keygen -l -f /home/runner/.ssh/id_rsa || echo "Invalid SSH key format"

          # Test SSH connection with verbose output and timeout
          ssh -v -o ConnectTimeout=10 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'" || {
            echo "SSH connection failed"
            exit 1
          }

      - name: Deploy to VPS
        run: |
          # Create directory if it doesn't exist and clone repository
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /home/${{ secrets.VPS_USER }}/transcribe_ai"
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "if [ ! -d /home/${{ secrets.VPS_USER }}/transcribe_ai/.git ]; then cd /home/${{ secrets.VPS_USER }}/transcribe_ai && git clone https://github.com/${{ github.repository }} .; fi"

          # Pull latest changes on VPS
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /home/${{ secrets.VPS_USER }}/transcribe_ai && git fetch origin && git checkout feature/docker_compose && git pull origin feature/docker_compose"

          # Build and start Docker containers
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd /home/${{ secrets.VPS_USER }}/transcribe_ai && docker-compose -f docker-compose.prod.yml up -d --build"

          # Clean up old images
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "docker image prune -f"
