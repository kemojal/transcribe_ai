name: Deploy FastAPI to VPS

on:
  push:
    branches:
      - feature/docker_compose
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Modify Dockerfile
        run: |
          # Replace Python image with Ubuntu
          sed -i 's/FROM python:3.11-slim as builder/FROM ubuntu:22.04 as builder/' Dockerfile.prod
          sed -i 's/FROM python:3.11-slim/FROM ubuntu:22.04/' Dockerfile.prod
          
          # Add Python installation commands
          sed -i '/WORKDIR \/app/a RUN apt-get update && apt-get install -y python3.11 python3-pip python3-venv python3-dev && ln -s /usr/bin/python3 /usr/bin/python' Dockerfile.prod

      - name: Set up SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/transcribe_ai && rm -rf ~/transcribe_ai/*

      - name: Copy files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "*"
          target: "~/transcribe_ai"

      - name: Setup Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Install Docker if needed
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker $USER
            fi
            
            # Configure Docker
            sudo mkdir -p /etc/docker
            echo '{
              "dns": ["8.8.8.8", "8.8.4.4"],
              "max-concurrent-downloads": 1,
              "max-concurrent-uploads": 1,
              "registry-mirrors": ["https://mirror.gcr.io"]
            }' | sudo tee /etc/docker/daemon.json
            
            # Restart Docker
            sudo systemctl restart docker || true

      - name: Build and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/transcribe_ai
            
            # Configure build environment
            export DOCKER_CLIENT_TIMEOUT=300
            export COMPOSE_HTTP_TIMEOUT=300
            
            # Create Ubuntu base image if needed
            if ! docker image inspect ubuntu:22.04 > /dev/null 2>&1; then
              wget -q http://cloud-images.ubuntu.com/minimal/releases/jammy/release/ubuntu-22.04-minimal-cloudimg-amd64-root.tar.xz
              echo 'FROM scratch
            COPY ubuntu-22.04-minimal-cloudimg-amd64-root.tar.xz /
            CMD ["/bin/bash"]' > Dockerfile.base
              docker build -t ubuntu:22.04 -f Dockerfile.base .
              rm -f Dockerfile.base ubuntu-22.04-minimal-cloudimg-amd64-root.tar.xz
            fi
            
            # Configure firewall
            sudo ufw --force enable
            sudo ufw allow 8025/tcp
            sudo ufw allow 22/tcp
            
            # Stop existing containers
            docker compose -f docker-compose.prod.yml down || true
            sudo fuser -k 8025/tcp || true
            
            # Build and start containers
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml run --rm api python -m app.init_db || echo "DB init failed, continuing anyway"
            docker compose -f docker-compose.prod.yml up -d

      - name: Check Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/transcribe_ai
            sleep 15
            echo "===== CONTAINER STATUS ====="
            docker ps
            
            echo "===== API LOGS ====="
            docker logs transcribe_ai-api-1 2>&1 || docker logs api-1 2>&1 || echo "API container not found"
            
            echo "===== CHECKING PORT ====="
            curl -v --connect-timeout 5 --max-time 10 http://localhost:8025/ || echo "Connection failed"
            
            echo "===== APPLICATION URL ====="
            echo "http://$(hostname -I | awk '{print $1}'):8025"
