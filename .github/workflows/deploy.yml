name: Deploy FastAPI to VPS

on:
  push:
    branches:
      - feature/docker_compose
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Debug SSH Setup
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          echo "SSH_AGENT_PID: $SSH_AGENT_PID"
          ssh-add -l
          echo "Testing SSH connection..."
          ssh -v -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'"

      - name: Fix docker-compose.prod.yml file
        run: |
          # Remove version attribute
          sed -i '/^version:/d' docker-compose.prod.yml
          
          # Add DNS configuration to services
          if grep -q "services:" docker-compose.prod.yml; then
            # Find if the api service exists
            if grep -q "api:" docker-compose.prod.yml; then
              SERVICE_LINE=$(grep -n "api:" docker-compose.prod.yml | cut -d: -f1)
              # Add dns entry with proper indentation
              sed -i "${SERVICE_LINE}a\\    dns:\\n      - 8.8.8.8\\n      - 8.8.4.4" docker-compose.prod.yml
            fi
            
            # Add environment variables for Docker timeouts
            if grep -q "environment:" docker-compose.prod.yml; then
              ENV_LINE=$(grep -n "environment:" docker-compose.prod.yml | head -1 | cut -d: -f1)
              INDENT=$(grep "environment:" docker-compose.prod.yml | head -1 | sed 's/environment:.*$//' | wc -c)
              SPACES=$(printf "%${INDENT}s")
              sed -i "${ENV_LINE}a\\${SPACES}  DOCKER_CLIENT_TIMEOUT: 120\\n${SPACES}  COMPOSE_HTTP_TIMEOUT: 120" docker-compose.prod.yml
            fi
          fi
          
          # Modify Dockerfile.prod to use local build only (no Docker Hub)
          if [ -f "Dockerfile.prod" ]; then
            # Replace the FROM statements with local build instructions
            sed -i 's/FROM python:3.11-slim as builder/FROM ubuntu:latest as builder/' Dockerfile.prod
            sed -i 's/FROM python:3.11-slim/FROM ubuntu:latest/' Dockerfile.prod
            
            # Add Python installation to the builder stage
            sed -i '/WORKDIR \/app/a RUN apt-get update \&\& apt-get install -y python3.11 python3.11-venv python3.11-dev python3-pip \&\& ln -s /usr/bin/python3.11 /usr/bin/python \&\& ln -s /usr/bin/pip3 /usr/bin/pip' Dockerfile.prod
          fi
          
          # Display the changes
          echo "Updated docker-compose.prod.yml:"
          cat docker-compose.prod.yml
          echo "Updated Dockerfile.prod:"
          cat Dockerfile.prod

      - name: Copy files to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ~/transcribe_ai || mkdir ~/transcribe_ai && cd ~/transcribe_ai
            rm -rf ./*
          EOF
          scp -r ./* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/transcribe_ai

      - name: Install Docker and Deploy
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ~/transcribe_ai
            
            # Install Docker if not installed
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker $USER
            fi

            # Install Docker Compose if not installed
            if ! docker compose version &> /dev/null; then 
              echo "Docker Compose plugin not found or not working, attempting to ensure it is installed."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            # Configure Docker to avoid Docker Hub
            echo "Configuring Docker to avoid Docker Hub..."
            sudo mkdir -p /etc/docker
            echo '{
              "dns": ["8.8.8.8", "8.8.4.4"],
              "max-concurrent-downloads": 1,
              "max-concurrent-uploads": 1,
              "build-kit": false
            }' | sudo tee /etc/docker/daemon.json
            
            # Create a minimal Ubuntu base image if needed
            if ! docker image inspect ubuntu:latest > /dev/null 2>&1; then
              echo "Attempting to pull ubuntu:latest once..."
              if ! sudo docker pull ubuntu:latest; then
                echo "Failed to pull ubuntu:latest, creating a minimal ubuntu base image..."
                # Create base Dockerfile
                cat > Dockerfile.base << EOF
FROM scratch
ADD ubuntu-base-20.04-base-arm64.tar.gz /
CMD ["/bin/bash"]
EOF
                
                # Get Ubuntu base image and build
                wget -q http://cdimage.ubuntu.com/ubuntu-base/releases/20.04/release/ubuntu-base-20.04-base-arm64.tar.gz
                sudo docker build -t ubuntu:latest -f Dockerfile.base .
                rm -f Dockerfile.base ubuntu-base-20.04-base-arm64.tar.gz
              fi
            fi
            
            # Restart Docker daemon
            sudo systemctl restart docker
            
            # Stop and remove existing containers
            docker compose -f docker-compose.prod.yml down || true
            
            # Kill any process using port 8025
            sudo fuser -k 8025/tcp || true
            
            # Enable and configure firewall
            sudo ufw --force enable
            sudo ufw allow 8025/tcp
            sudo ufw allow 22/tcp
            
            # Add Docker build and pull timeout environment variables
            export DOCKER_CLIENT_TIMEOUT=300
            export COMPOSE_HTTP_TIMEOUT=300
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0
            
            # Build the images with --no-cache and network=host to avoid Docker Hub
            echo "Building Docker images..."
            docker compose -f docker-compose.prod.yml build --no-cache --network=host
            
            # Try to run the database initialization script
            echo "Running database initialization script..."
            docker compose -f docker-compose.prod.yml run --rm api python -m app.init_db || echo "Failed to run init_db script - will continue anyway"
            
            # Start containers
            echo "Starting containers..."
            docker compose -f docker-compose.prod.yml up -d
            
            # Wait for containers to start
            sleep 15
            
            # Check logs for the API container to diagnose issues
            echo "======== API CONTAINER LOGS ========"
            # Try different potential service names
            docker logs aply-backend-api-1 2>&1 || docker logs transcribe_ai-api-1 2>&1 || docker logs api-1 2>&1 || echo "Could not find API container"
            
            # Print debugging information
            echo "Container status:"
            docker ps
            echo "Container logs:"
            docker compose -f docker-compose.prod.yml logs
            echo "Network information:"
            netstat -tulpn | grep -E ':8025'
            echo "Firewall status:"
            sudo ufw status
            
            # Print the URLs
            echo "Application is running on:"
            echo "http://$(hostname -I | awk '{print $1}'):8025"
            
            # Test the connection locally with timeout
            echo "Testing local connection..."
            curl -v --connect-timeout 5 --max-time 10 http://localhost:8025/
            
            # Check container logs for any errors
            echo "Checking container logs for errors..."
            docker compose -f docker-compose.prod.yml logs | grep -i error
            
            # Check if the containers are healthy
            echo "Checking container health..."
            docker ps --format "{{.Names}}: {{.Status}}"
            
            # Check if port is actually listening
            echo "Checking if port is listening..."
            sudo lsof -i :8025 || echo "No process is listening on port 8025"
            
            # Additional troubleshooting
            echo "Docker network information:"
            docker network ls
            
            # Check if any container is using port 8025
            echo "Containers with port 8025:"
            docker ps -a | grep 8025
          EOF
