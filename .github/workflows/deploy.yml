name: Deploy FastAPI to VPS

on:
  push:
    branches:
      - feature/docker_compose
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Debug SSH Setup
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          echo "SSH_AGENT_PID: $SSH_AGENT_PID"
          ssh-add -l
          echo "Testing SSH connection..."
          ssh -v -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'"

      - name: Copy files to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ~/transcribe_ai || mkdir ~/transcribe_ai && cd ~/transcribe_ai
            rm -rf ./*
          EOF
          scp -r ./* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/transcribe_ai

      - name: Install Docker and Deploy
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ~/transcribe_ai
            
            # Install Docker if not installed
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker $USER
            fi

            # Install Docker Compose if not installed
            if ! command -v docker compose &> /dev/null; then
              echo "Installing Docker Compose..."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            # Stop and remove existing containers
            docker compose -f docker-compose.prod.yml down || true
            
            # Kill any process using port 8000
            sudo fuser -k 8000/tcp || true
            
            # Enable and configure firewall
            sudo ufw --force enable
            sudo ufw allow 8000/tcp
            sudo ufw allow 22/tcp
            
            # Build and start containers
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Wait for containers to start
            sleep 10
            
            # Print debugging information
            echo "Container status:"
            docker ps
            echo "Container logs:"
            docker compose -f docker-compose.prod.yml logs
            echo "Network information:"
            netstat -tulpn | grep -E ':8000'
            echo "Firewall status:"
            sudo ufw status
            
            # Print the URLs
            echo "Application is running on:"
            echo "http://$(hostname -I | awk '{print $1}'):8000"
            
            # Test the connection locally with timeout
            echo "Testing local connection..."
            curl -v --connect-timeout 5 --max-time 10 http://localhost:8000/
            
            # Check container logs for any errors
            echo "Checking container logs for errors..."
            docker compose -f docker-compose.prod.yml logs | grep -i error
            
            # Check if the containers are healthy
            echo "Checking container health..."
            docker ps --format "{{.Names}}: {{.Status}}"
            
            # Check if port is actually listening
            echo "Checking if port is listening..."
            sudo lsof -i :8000
          EOF
