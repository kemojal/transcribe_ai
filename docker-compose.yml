services:
  db:
    image: postgres:15-alpine
    container_name: transcribe_ai_db
    environment:
      - POSTGRES_USER=transcribe_ai
      - POSTGRES_PASSWORD=transcribe_ai
      - POSTGRES_DB=transcribe_ai
    ports:
      - "5466:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcribe_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcribe_ai_backend
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://transcribe_ai:transcribe_ai@db:5432/transcribe_ai
      - ENVIRONMENT=development
      - ENABLE_METRICS=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - transcribe_ai_logs:/var/log/transcribe_ai
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - app_network

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    volumes:
      - backup_data:/backups
      - transcribe_ai_logs:/var/log/transcribe_ai
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=transcribe_ai
      - PGPASSWORD=transcribe_ai
      - BACKUP_DIR=/backups
      - RETENTION_DAYS=7
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: transcribe_ai_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - app_network

  grafana:
    image: grafana/grafana:latest
    container_name: transcribe_ai_grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - app_network

  loki:
    image: grafana/loki:latest
    container_name: transcribe_ai_loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_network

  promtail:
    image: grafana/promtail:latest
    container_name: transcribe_ai_promtail
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/log:/var/log
      - transcribe_ai_logs:/var/log/transcribe_ai
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app_network

volumes:
  postgres_data:
  backup_data:
  prometheus_data:
  grafana_data:
  loki_data:
  transcribe_ai_logs:

networks:
  app_network:
    driver: bridge
