version: "3.8"

services:
  db:
    image: postgres:15
    container_name: transcribe_ai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: transcribe_ai
    ports:
      - "5466:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: transcribe_ai_backend
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:12345@db:5432/transcribe_ai
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
