version: "3.8"

services:
  db:
    image: postgres:15
    container_name: transcribe_ai_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      POSTGRES_DB: ${POSTGRES_DB:-transcribe_ai}
    ports:
      - "5466:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: transcribe_ai_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-12345}@db:5432/${POSTGRES_DB:-transcribe_ai}
      - ENVIRONMENT=production
      - ENABLE_METRICS=true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8000"
    labels:
      - "traefik.http.routers.backend.rule=Host(`api.transcribai.kemojallow.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

    restart: unless-stopped
    networks:
      - app_network

  backup:
    image: postgres:15
    container_name: transcribe_ai_backup
    volumes:
      - ./scripts:/scripts
      - backup_data:/backups
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-12345}
      - POSTGRES_DB=${POSTGRES_DB:-transcribe_ai}
    command: >
      bash -c "chmod +x /scripts/backup_db.sh && 
               echo '0 2 * * * /scripts/backup_db.sh' > /etc/crontabs/root && 
               crond -f"
    networks:
      - app_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: transcribe_ai_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - app_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: transcribe_ai_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - app_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: transcribe_ai_grafana
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    networks:
      - app_network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: transcribe_ai_loki
    ports:
      - "3100:3100"
    networks:
      - app_network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: transcribe_ai_promtail
    volumes:
      - /var/log:/var/log
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  backup_data:
  grafana_data:
  prometheus_data:
